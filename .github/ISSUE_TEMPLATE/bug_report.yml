name: Bug report
description: Something in Founders Theater doesn't work as it should.
labels: ["bug"]
body:
  - type: input
    id: addon_version
    attributes:
      label: Founders Theater version
      description: Kodi → Add-ons → My add-ons → Program add-ons → Founders Theater.
      placeholder: "0.6.2"
    validations:
      required: true
  - type: input
    id: kodi_version
    attributes:
      label: Kodi version
      description: Settings → System information.
      placeholder: "21.2"
    validations:
      required: true
  - type: dropdown
    id: device
    attributes:
      label: Device
      options:
        - Android TV / Google TV
        - Fire TV
        - Nvidia Shield
        - CoreELEC / LibreELEC
        - Vero (OSMC)
        - Windows
        - macOS
        - Linux
        - Other
    validations:
      required: true
  - type: input
    id: silo_version
    attributes:
      label: Silo server version
      description: Shown in Silo's web admin. Ask your server's admin if you don't know it.
      placeholder: "build-1642"
    validations:
      required: true
  - type: textarea
    id: what_happened
    attributes:
      label: What happened?
      description: Include the exact error message, if one was shown.
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Open …
        2. Select …
        3. …
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: log
    attributes:
      label: Kodi log
      description: |
        Reproduce the problem, then paste the log or a link from the Kodi Logfile Uploader add-on.
        Remove your server address, usernames and any tokens before posting.
      render: text
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I'm on the latest Founders Theater version.
          required: true
        - label: I searched existing issues and this isn't a duplicate.
          required: true
