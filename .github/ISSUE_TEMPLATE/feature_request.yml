name: Feature request
description: Suggest something new for Founders Theater.
labels: ["enhancement"]
body:
  - type: textarea
    id: request
    attributes:
      label: What would you like?
    validations:
      required: true
  - type: textarea
    id: reason
    attributes:
      label: Why is it useful?
      description: What would it let you do that you can't do today?
    validations:
      required: true
  - type: checkboxes
    id: checks
    attributes:
      label: Before submitting
      options:
        - label: I searched existing issues and this hasn't been requested.
          required: true
